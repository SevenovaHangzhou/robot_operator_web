<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>底盘操作</title>
<link rel="stylesheet" href="/static/common/base.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-state="down">

<header class="glass bar">
  <div class="brand"><span class="brand-name">底盘操作</span><span class="lbl" id="backend-badge">等待底盘</span></div>
  <div class="status-pill" role="status" aria-live="polite">
    <span class="dot"></span><span class="status-word" id="ctrl-state">未连接</span><span class="status-note" id="ctrl-detail">等待底盘运行栈启动</span>
  </div>
  <div class="spacer"></div>
  <div class="facts"><span class="tag bad" id="conn">网页未连接</span><span class="tag" id="lease-chip">无控制权</span></div>
  <nav class="nav" aria-label="页面"><a href="/">状态</a><a class="on" href="/chassis" aria-current="page">底盘操作</a><a href="/arm">机械臂与头部</a></nav>
</header>

<main class="drive-layout">
  <section class="glass card drive" aria-label="遥控">
    <div class="head"><b>遥控</b><span id="gear-tag"></span></div>
    <div class="pad">
      <button class="yaw-btn" data-yaw="1" type="button" aria-label="逆时针旋转"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 15a13 13 0 1 1 -3.5 13"/><path d="M14 6v9h9"/></svg><span>Q</span></button>
      <div id="stick" class="stick disabled" aria-label="平移摇杆" tabindex="0">
        <i class="ring r1"></i><i class="ring r2"></i><i class="cross"></i>
        <span class="axis axis-x">前</span><span class="axis axis-y">左</span>
        <div id="stick-knob" class="stick-knob"></div>
      </div>
      <button class="yaw-btn" data-yaw="-1" type="button" aria-label="顺时针旋转"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M34 15a13 13 0 1 0 3.5 13"/><path d="M34 6v9h-9"/></svg><span>E</span></button>
    </div>
    <div class="readout">
      <div><span class="lbl">前进 vx</span><div class="big"><span id="rd-vx">0.000</span><small>m/s</small></div></div>
      <div><span class="lbl">横移 vy</span><div class="big"><span id="rd-vy">0.000</span><small>m/s</small></div></div>
      <div><span class="lbl">旋转 ω</span><div class="big"><span id="rd-wz">0.000</span><small>rad/s</small></div></div>
    </div>
  </section>

  <div class="side">
    <section class="glass card control" aria-label="底盘控制">
      <div class="head"><b>底盘</b></div>
      <button id="enable-op" class="btn go wide" type="button" disabled>使能底盘</button>
      <button id="reset-op" class="btn warn wide" type="button" hidden>故障复位</button>
      <div class="group">
        <span class="lbl">档位</span>
        <div id="gear-op" class="segment" role="radiogroup" aria-label="档位"></div>
        <span id="gear-detail" class="hint"></span>
      </div>
      <div class="actions">
        <button id="lease-op" class="btn" type="button">获取控制权</button>
        <button id="soft-stop" class="btn stop" type="button">停止移动<kbd>空格</kbd></button>
      </div>
      <p class="hint">停止移动是软件停止，不是硬件急停。</p>
    </section>

    <section class="glass card keys" aria-label="键盘操作">
      <div class="head"><b>键盘</b><span>松开即停</span></div>
      <div class="keymap">
        <div class="cluster">
          <kbd class="k-w">W</kbd><kbd class="k-a">A</kbd><kbd class="k-s">S</kbd><kbd class="k-d">D</kbd>
          <span class="lbl">平移</span>
        </div>
        <div class="cluster yaw">
          <kbd>Q</kbd><kbd>E</kbd><span class="lbl">逆 / 顺时针</span>
        </div>
        <div class="cluster space"><kbd>空格</kbd><span class="lbl">停止</span></div>
      </div>
    </section>

    <section class="glass card command" aria-label="指令">
      <div class="head"><b>指令</b><span id="moving"></span></div>
      <dl class="rows">
        <div><dt>目标速度</dt><dd id="rd-target">—</dd></div>
        <div><dt>停止原因</dt><dd class="mono" id="stop-reason">—</dd></div>
        <div><dt>速度接口</dt><dd class="mono" id="endpoint">/rt/base/cmd_vel</dd></div>
      </dl>
      <p id="last-result" class="result" role="status"></p>
    </section>
  </div>
</main>

<div class="login glass" id="login">
  <form id="login-form">
    <b>登录</b>
    <label>令牌 <input class="field" id="token" type="password" autocomplete="current-password" required></label>
    <div class="login-row"><span id="login-error"></span><button class="btn primary" type="submit">登录</button></div>
  </form>
</div>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
